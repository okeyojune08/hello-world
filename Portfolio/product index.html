<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special shop</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box;}
        body{ font-family:Arial; background: #f5f5f5;padding:40px}
        h1 {text-align:center;margin-bottom:30px;}
        .shop {display: grid;grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:25px; max-width:1000px;margin:auto;
        }
        .product {background: white; border-radius:15px; padding:15px; box-shadow: 0 5px 20px #0001; transition: 0.3s}
        .product :hover {transform: translateY(-5px); }
        .product img {width:100%; border-radius:10px; height: 200px; object-fit: cover;}
        .product h3 {margin: 12px 0 5px;}
        .price {colour: #0ea5e9; font-weight: bold; font-size: 20px}
        .old {color:gray; text-decoration: line-through; font-size: 14px; margin-left: 8px;}
        button {width: 100%; margin-top:12px; padding:10px; background:black; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold;}
        button:hover {background: #0ea5e9}
    </style>
</head>
<body>
    <h1>Toto's Special Store</h1>
    <div class="shop">
        <div class="product">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">
            <h3>Nike Air Max</h3>
            <p>Comfortable running shoes</p>
            <p><span class="price">KSh 4,500</span><span class="old">KSh 6,000</span></p>
            <button>Add to cart</button>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30">
            <h3>Smart watch</h3>
            <p>Track your fittness daily</p>
            <p><span class="price">KSh 2,999</span><span class="old">KSh 3,500</span></p>
            <button>Add to cart</button>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e">
            <h3>Headphones</h3>
            <p>Noise cancelling sound</p>
            <p><span class="price">KSh 1,800</span><span class="old">KSh 2,500</span></p>
            <button>Add to cart</button>
        </div>
    </div>
        <div>
            <p>We deliver at affordable prices</p>
        </div>
</body>
</html>
