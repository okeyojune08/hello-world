<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            color: #f3eeee;
            background-color: #0f172a;
            text-align: center;
        }
        .hero {
            padding: 100px 20px;
        }
        h1 {
            color: #38bdf8;
            font-size: 50px;
        }
        h1 span {
            color: hwb(60 96% 3%);
        }
        p {
            font-size: 18px;
            color: #94a3b8;
        }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            border-radius: 30px;
            font-weight: bold;
        }
        button:hover {
            background-color: #fafbfc;
        }

    </style>
</head>
<body>

<div class="hero">
    <h1>Hi, I'm <span>June </span></h1>
    <p>I am a Web Developer from Kenya, building cool things for the web.</p>
    <button>View my work</button>

    <div class="card-box">
        <div class="card">
            <h3>Fast</h3>
            <p>I build fast websites</p>
        </div>
        <div class="card">
            <h3>design</h3>
            <p>Clean and modern design</p>
        </div>
        <div class="card">
            <h3>code</h3>
            <p>Clean HTML & CSS</p>
            </div>
    </div>
</div>
</body>
</html>
